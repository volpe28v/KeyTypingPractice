<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイピングマスター</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/src/styles.css">
</head>

<body>
    <div class="version-display">v1.0.1</div>
    
    <!-- ログインモーダル -->
    <div id="login-modal" class="login-modal">
        <div class="login-modal-content">
            <div class="login-header">
                <h2>タイピングマスター</h2>
                <p>Googleアカウントでログインしてください</p>
            </div>
            <button id="google-sign-in-btn" class="google-sign-in-btn">
                <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" class="google-logo">
                Googleでサインイン
            </button>
        </div>
    </div>

    <div id="user-info" class="user-info"></div>

    <div class="main-container">
        <div class="game-container">
            <div class="typing-area">
                <button id="back-to-title-btn" class="back-to-title-btn">レッスン選択に戻る</button>
                <div class="word-display" id="word-display"></div>
                <div class="hidden-letters-container" id="hidden-letters-container">
                    <div class="hidden-letters" id="hidden-letters"></div>
                </div>
                <button id="replay-audio-btn" class="replay-audio-btn" onclick="replayCurrentWord()" title="発音を再生">🔊</button>
                <button id="reset-audio-btn" class="reset-audio-btn" title="音声をリセット">🔇</button>
                <div class="meaning" id="meaning"></div>
                <div class="timer-display" id="timer-display">00.00</div>
                <div class="input-area">
                    <input type="text" id="word-input" autocomplete="off" placeholder="" 
                           inputmode="none" style="ime-mode: disabled;" lang="en">
                </div>
                <div class="feedback" id="feedback"></div>
                <div class="progress">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>
            
            <!-- レッスンモード選択画面 -->
            <div class="lesson-mode-selection" id="lesson-mode-selection" style="display: none;">
                <div class="lesson-title-section">
                    <h2 id="selected-lesson-name">レッスン名</h2>
                    <span id="selected-lesson-language" class="lesson-language-badge"></span>
                    <input type="text" id="lesson-name-edit-input" class="lesson-name-edit-input" style="display: none;" />
                </div>
                
                <div class="lesson-words-edit">
                    <div class="words-list-header">
                        <h3>単語リスト</h3>
                        <button class="btn-delete-lesson edit-toggle" onclick="toggleWordsEdit()">編集</button>
                    </div>
                    <div id="words-display" class="words-display"></div>
                    <div id="lesson-language-edit-container" class="lesson-language-select" style="display: none;">
                        <label for="lesson-language-edit">単語の言語:</label>
                        <select id="lesson-language-edit">
                            <option value="en-US">English（英語）</option>
                            <option value="ms-MY">Bahasa Melayu（マレー語）</option>
                        </select>
                    </div>
                    <textarea id="words-edit-area" class="words-edit-area" style="display: none;" placeholder="単語, 意味の形式で入力してください"></textarea>
                    <div id="words-edit-controls" class="words-edit-controls btn-group" style="display: none;">
                        <button class="mode-btn save-words-btn" onclick="saveWordsEdit()">保存</button>
                    </div>
                </div>

                <div class="mode-selection">
                    <h3>学習モード</h3>
                    <div class="mode-buttons">
                        <button class="mode-btn" data-mode="vocabulary-learning" onclick="startLessonWithMode('vocabulary-learning')">Lv0: 単語学習</button>
                        <button class="mode-btn" data-mode="progressive" onclick="startLessonWithMode('progressive')">Lv1: 反復練習</button>
                        <button class="mode-btn" data-mode="pronunciation-meaning" onclick="startLessonWithMode('pronunciation-meaning')">Lv2: 発音＋日本語</button>
                        <button class="mode-btn" data-mode="pronunciation-only" onclick="startLessonWithMode('pronunciation-only')">Lv3: 発音のみ</button>
                        <button class="mode-btn" data-mode="japanese-reading" onclick="startLessonWithMode('japanese-reading')">Lv4: 日本語のみ</button>
                        <button class="mode-btn" data-mode="pronunciation-blind" onclick="startLessonWithMode('pronunciation-blind')">Lv5: 発音（文字数隠し）</button>
                    </div>
                </div>

                <!-- レッスン別ランキング表示エリア -->
                <div class="lesson-ranking-section" id="lesson-ranking-section" style="display: none;">
                    <h3>ランキング</h3>
                    <div class="lesson-ranking-tabs" id="lesson-ranking-tabs">
                        <!-- Lv1-Lv5のタブ（JSで動的生成） -->
                    </div>
                    <div class="lesson-ranking-list" id="lesson-ranking-list">
                        <!-- ランキング表示（JSで動的生成） -->
                    </div>
                </div>

                <div class="lesson-mode-buttons btn-group">
                    <button id="lesson-delete-btn" class="btn-delete-lesson" onclick="deleteSelectedLesson()">削除</button>
                </div>
            </div>

            <!-- カスタムレッスン設定画面 -->
            <div class="custom-lesson-setup" id="custom-lesson-setup">
                <h2>新しいレッスンを追加</h2>
                
                <div class="lesson-name-input">
                    <label for="lesson-name-input">レッスン名（任意）:</label>
                    <input type="text" id="lesson-name-input" placeholder="例: 基本単語、フルーツ名など">
                </div>

                <div class="lesson-language-select">
                    <label for="lesson-language">単語の言語:</label>
                    <select id="lesson-language">
                        <option value="en-US">English（英語）</option>
                        <option value="ms-MY">Bahasa Melayu（マレー語）</option>
                    </select>
                </div>
                
                <textarea id="custom-words-input" placeholder="単語と意味を入力してください&#10;形式: 単語, 意味&#10;例:&#10;apple, りんご&#10;banana, バナナ&#10;orange, オレンジ&#10;&#10;※レッスンとして保存されます"></textarea>
                
                <div class="custom-lesson-buttons btn-group">
                    <button class="btn btn-success save-lesson-btn" onclick="saveNewLessonOnly()">保存</button>
                    <button class="btn btn-secondary cancel-custom-btn" onclick="cancelCustomLesson()">キャンセル</button>
                </div>
                
                <div class="mode-selection">
                    <h3>学習モード</h3>
                    <div class="mode-buttons">
                        <button class="mode-btn" data-mode="vocabulary-learning" onclick="saveAndStartLesson('vocabulary-learning')">Lv0: 単語学習</button>
                        <button class="mode-btn" data-mode="progressive" onclick="saveAndStartLesson('progressive')">Lv1: 反復練習</button>
                        <button class="mode-btn" data-mode="pronunciation-meaning" onclick="saveAndStartLesson('pronunciation-meaning')">Lv2: 発音＋日本語</button>
                        <button class="mode-btn" data-mode="pronunciation-only" onclick="saveAndStartLesson('pronunciation-only')">Lv3: 発音のみ</button>
                        <button class="mode-btn" data-mode="japanese-reading" onclick="saveAndStartLesson('japanese-reading')">Lv4: 日本語のみ</button>
                        <button class="mode-btn" data-mode="pronunciation-blind" onclick="saveAndStartLesson('pronunciation-blind')">Lv5: 発音（文字数隠し）</button>
                    </div>
                </div>
            </div>

            <div class="score-display" id="score-display"></div>
            
            <div class="keyboard-display-container">
                <div class="keyboard-display">
                    <div class="keyboard-row number-row">
                        <div class="key" data-key="1">1<span class="shift-char">!</span></div>
                        <div class="key" data-key="2">2</div>
                        <div class="key" data-key="3">3</div>
                        <div class="key" data-key="4">4</div>
                        <div class="key" data-key="5">5</div>
                        <div class="key" data-key="6">6</div>
                        <div class="key" data-key="7">7<span class="shift-char">'</span></div>
                        <div class="key" data-key="8">8</div>
                        <div class="key" data-key="9">9</div>
                        <div class="key" data-key="0">0</div>
                        <div class="key" data-key="-">-</div>
                    </div>
                    <div class="keyboard-row">
                        <div class="key" data-key="q">Q</div>
                        <div class="key" data-key="w">W</div>
                        <div class="key" data-key="e">E</div>
                        <div class="key" data-key="r">R</div>
                        <div class="key" data-key="t">T</div>
                        <div class="key" data-key="y">Y</div>
                        <div class="key" data-key="u">U</div>
                        <div class="key" data-key="i">I</div>
                        <div class="key" data-key="o">O</div>
                        <div class="key" data-key="p">P</div>
                    </div>
                    <div class="keyboard-row second-row">
                        <div class="key" data-key="a">A</div>
                        <div class="key" data-key="s">S</div>
                        <div class="key" data-key="d">D</div>
                        <div class="key" data-key="f">F</div>
                        <div class="key" data-key="g">G</div>
                        <div class="key" data-key="h">H</div>
                        <div class="key" data-key="j">J</div>
                        <div class="key" data-key="k">K</div>
                        <div class="key" data-key="l">L</div>
                    </div>
                    <div class="keyboard-row third-row">
                        <div class="key shift-key" data-key="shift">Shift</div>
                        <div class="key" data-key="z">Z</div>
                        <div class="key" data-key="x">X</div>
                        <div class="key" data-key="c">C</div>
                        <div class="key" data-key="v">V</div>
                        <div class="key" data-key="b">B</div>
                        <div class="key" data-key="n">N</div>
                        <div class="key" data-key="m">M</div>
                        <div class="key" data-key=",">,</div>
                        <div class="key" data-key=".">.</div>
                        <div class="key" data-key="/">/<span class="shift-char">?</span></div>
                    </div>
                    <div class="keyboard-row">
                        <div class="key space-key" data-key=" ">Space</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="records-sidebar">
            <div class="weekly-leaderboard" id="weekly-leaderboard">
                <h3 class="leaderboard-title">🏆 今週のランキング</h3>
                <div id="leaderboard-list" class="leaderboard-list"></div>
                <div id="leaderboard-message" class="leaderboard-message"></div>
            </div>

            <h2>レッスン</h2>

            <!-- 動的に生成されるレベル記録がここに入ります -->
            
            <button onclick="clearRecords()" class="clear-records-btn">記録をクリア</button>
        </div>
    </div>

    <!-- 公開レッスンブラウザ -->
    <div class="public-lesson-browser" id="public-lesson-browser" style="display: none;">
        <h2>公開レッスン一覧</h2>
        <div id="public-lesson-list" class="public-lesson-list">
            <!-- 動的生成: レッスンカード + お気に入り追加ボタン -->
        </div>
        <div class="public-lesson-browser-buttons btn-group">
            <button class="btn btn-secondary" onclick="closePublicLessonBrowser()">閉じる</button>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
